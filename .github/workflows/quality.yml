name: Automated quality gate

on:
  push:
    branches: [develop, 'integration/**', 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all tests and reject TODO or skip
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/quality-evidence"
          set -o pipefail
          node scripts/verify-sprint3.cjs 2>&1 | tee "$RUNNER_TEMP/quality-evidence/quality.tap"
      - name: Check the isolated demo environment
        shell: bash
        run: node scripts/check-demo.cjs > "$RUNNER_TEMP/quality-evidence/demo-smoke.json"
      - name: Preserve actual output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/quality-evidence/
          if-no-files-found: warn
          retention-days: 14
