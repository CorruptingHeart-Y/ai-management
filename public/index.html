<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爱管理 · Sprint 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>爱管理</h1>
    <p class="subtitle">Sprint 1 最小功能闭环：查看成员 → 创建并分配任务 → 更新状态</p>
  </header>

  <main>
    <!-- US01 查看项目成员 -->
    <section class="card" aria-labelledby="members-heading">
      <h2 id="members-heading">项目成员</h2>
      <p id="member-message" class="member-message" role="status" aria-live="polite">正在加载项目成员…</p>
      <ul id="member-list" class="member-list" aria-busy="true">
        <li class="empty">加载中…</li>
      </ul>
      <button id="member-retry" type="button" hidden>重新加载成员</button>
    </section>

    <!-- US04 创建并分配任务 -->
    <section class="card">
      <h2>创建任务</h2>
      <form id="task-form">
        <label>
          任务标题 <span class="required">*</span>
          <input id="task-title" name="title" type="text" placeholder="例如：完成 Sprint 1 演示" />
        </label>
        <label>
          任务描述
          <textarea id="task-desc" name="description" rows="3" placeholder="选填"></textarea>
        </label>
        <label>
          负责人 <span class="required">*</span>
          <select id="task-assignee" name="assigneeId" disabled aria-describedby="member-message">
            <option value="">—— 请选择成员 ——</option>
          </select>
        </label>
        <p id="form-message" class="message" role="alert"></p>
        <button id="create-task" type="submit" disabled>创建任务</button>
      </form>
    </section>

    <!-- 任务列表与 US05 状态更新 -->
    <section class="card">
      <h2>任务列表</h2>
      <ul id="task-list" class="task-list">
        <li class="empty">加载中…</li>
      </ul>
      <p id="task-message" class="message" role="alert"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
