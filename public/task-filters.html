<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务视图 · 爱管理</title>
  <link rel="stylesheet" href="task-filters.css">
  <script src="iterations.js" defer></script>
  <script src="session.js" defer></script>
  <script src="task-filters-page.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到任务</a>
  <header class="app-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">管</span>爱管理</a>
    <nav aria-label="主导航">
      <a href="index.html">工作台</a>
      <a href="task-filters.html" aria-current="page">任务</a>
      <a href="stats.html">统计</a>
    </nav>
    <a class="header-account" href="index.html#auth-bar">登录 / 工作台</a>
  </header>

  <main id="main">
    <div class="page-heading">
      <div><p class="eyebrow">项目工作区</p><h1>任务视图</h1></div>
      <button id="refresh" type="button">刷新</button>
    </div>
    <div class="view-bar">
      <div class="view-tabs" role="group" aria-label="任务范围">
        <button id="view-all" type="button" aria-pressed="true">全部任务 <span id="total-count">-</span></button>
        <button id="view-overdue" type="button" aria-pressed="false">仅逾期 <span id="overdue-count">-</span></button>
      </div>
      <p id="as-of" class="as-of" aria-live="polite"></p>
    </div>

    <form id="filters" class="filter-form" aria-label="筛选任务">
      <label class="search-field"><span>搜索</span><input id="query" name="q" type="search" maxlength="100" placeholder="任务标题或描述" autocomplete="off"></label>
      <label><span>状态</span><select id="filter-status" name="status"><option value="">全部状态</option><option value="TODO">待办</option><option value="DOING">进行中</option><option value="DONE">已完成</option></select></label>
      <label><span>优先级</span><select id="filter-priority" name="priority"><option value="">全部优先级</option><option value="HIGH">高</option><option value="MEDIUM">中</option><option value="LOW">低</option></select></label>
      <label><span>负责人</span><select id="filter-assignee" name="assigneeId"><option value="">全部负责人</option></select></label>
      <label><span>迭代</span><select id="filter-iteration" name="iterationId"><option value="">全部迭代</option><option value="unassigned">未归属</option></select></label>
      <button type="submit" class="primary">筛选</button>
      <button id="reset" type="button" class="quiet">重置</button>
    </form>

    <section class="task-section" aria-labelledby="results-title">
      <div class="results-toolbar">
        <h2 id="results-title">任务 <span id="matched-count" class="count">-</span></h2>
        <label class="group-toggle"><input id="group-iteration" type="checkbox">按迭代分组</label>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="failure" class="failure" role="alert" hidden>
        <p id="failure-message"></p>
        <div class="failure-actions"><button id="retry" type="button">重试</button><a id="login-link" href="index.html#auth-bar" hidden>返回工作台登录</a></div>
      </div>
      <div id="results" aria-busy="true"><p class="empty-state">正在读取任务…</p></div>
    </section>
  </main>
</body>
</html>
